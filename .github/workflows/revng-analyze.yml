name: revng Analyze

# Exploratory run of rev.ng (https://rev.ng) against the same target
# binary as ghidra-analyze.yml, as an alternative/cross-check tool -
# user's choice to try it out. This is a first pass: rev.ng's own
# function-boundary detection is used to cross-validate the addresses
# Ghidra's FindConstructedVtables.java already flagged (does rev.ng
# agree these are real function entries?), and to see whether it finds
# additional function starts near the known-interesting neighborhood
# (FUN_09053250 and its 2 known callers, ~0x09000000-0x09070000) that
# Ghidra's heuristics missed. Full whole-binary decompilation is NOT
# attempted here - this binary is ~330MB and rev.ng's scalability at
# that size for a from-scratch auto-analysis is untested in this
# project, so the first run just imports + runs the initial
# auto-analysis and inspects the resulting model, rather than also
# paying for a (possibly very expensive or failing) emit-c pass.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Install revng (distributable binary release)
        run: |
          curl -L -s https://rev.ng/downloads/revng-distributable/master/install.sh | bash
          echo "$PWD/revng" >> "$GITHUB_PATH"

      - name: Download target binary from this repo's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ghidra-binary --repo ${{ github.repository }} --pattern "libminecraftpe.so"

      - name: revng doctor / sanity check
        run: |
          {
            echo "=== which revng ==="
            which revng || true
            echo "=== revng --help ==="
            revng --help || true
            echo "=== revng version ==="
            revng version || true
            echo "=== revng model --help ==="
            revng model --help || true
            echo "=== revng artifact --help ==="
            revng artifact --help || true
            echo "=== ls -la \$PWD/revng (install dir) ==="
            ls -la "$PWD/revng" || true
          } > revng_cli_discovery.log 2>&1
          cat revng_cli_discovery.log

      - name: Import binary into a revng model
        run: |
          revng analyze import-binary libminecraftpe.so -o model.yml 2>&1 | tee import.log
          echo "--- model.yml (first 60 lines) ---"
          head -60 model.yml || true
          wc -l model.yml || true

      - name: Run initial auto-analysis
        run: |
          set -x
          revng analyze --help 2>&1 | tee analyze_help.log || true
          revng analyze \
            --resume=working-directory \
            revng-initial-auto-analysis \
            libminecraftpe.so \
            -o /dev/null 2>&1 | tee autoanalysis.log
          echo "--- working-directory layout (depth 4) ---"
          find working-directory -maxdepth 4 2>&1 | tee workdir_layout.log

      - name: Extract function list from the model
        run: |
          set -x
          # The exact on-disk path/format of the post-analysis model
          # wasn't confirmed ahead of time (rev.ng's docs don't fully
          # spell out the resume-directory layout), so locate it by
          # searching the resume directory for any YAML containing a
          # Functions: list instead of guessing one fixed path.
          MODEL_FILE=""
          for f in $(find working-directory -type f \( -name "*.yml" -o -name "*.yaml" \) 2>/dev/null); do
            if grep -q "^Functions:" "$f" 2>/dev/null; then
              MODEL_FILE="$f"
              break
            fi
          done
          echo "Resolved model file: ${MODEL_FILE:-NONE FOUND}" | tee model_resolution.log

          if [ -n "$MODEL_FILE" ]; then
            cp "$MODEL_FILE" model_dump.yml
          else
            : > model_dump.yml
          fi
          grep -c "Entry:" model_dump.yml > function_count.txt 2>&1 || echo "0" > function_count.txt

          {
            echo "=== Resolved model file: ${MODEL_FILE:-NONE FOUND} ==="
            echo ""
            echo "=== Known addresses of interest (from Ghidra-side investigation) ==="
            for addr in 09053250 09054334 090647b8 090f331c 090f588c 09064b54 14087ce0; do
              echo "--- 0x$addr ---"
              grep -i "0x0*$addr" model_dump.yml || echo "  (not found as a function entry)"
            done
            echo ""
            echo "=== Function count ==="
            cat function_count.txt
            echo ""
            echo "=== All function entries in 0x09000000-0x09100000 (known-interesting neighborhood) ==="
            grep -oE '"0x0?9[0-9a-f]{6}:Code_[a-z0-9_]+"' model_dump.yml | sort -u || echo "  (none found / pattern mismatch - see raw dump)"
          } > revng_findings.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: revng-results
          path: |
            model.yml
            model_dump.yml
            revng_findings.txt
            import.log
            autoanalysis.log
          if-no-files-found: warn

      - name: Commit results to the repo
        if: always()
        run: |
          mkdir -p Revng-Analysis-Data
          STAMP=$(date +%Y%m%d-%H%M%S)
          cp revng_findings.txt "Revng-Analysis-Data/revng_findings-$STAMP.txt" 2>/dev/null || true
          # Debug logs - small, always commit directly (not just as a
          # workflow artifact, which this project can't reliably fetch
          # back from outside GitHub Actions).
          for log in revng_cli_discovery.log import.log analyze_help.log autoanalysis.log workdir_layout.log model_resolution.log; do
            [ -f "$log" ] && cp "$log" "Revng-Analysis-Data/${log%.log}-$STAMP.log"
          done
          # model_dump.yml can be very large for a 330MB binary - only
          # commit it if it's under a sane size.
          if [ -f model_dump.yml ] && [ "$(stat -c%s model_dump.yml 2>/dev/null || echo 999999999)" -lt 20000000 ]; then
            cp model_dump.yml "Revng-Analysis-Data/model_dump-$STAMP.yml"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Revng-Analysis-Data/ || true
          if ! git diff --cached --quiet; then
            git commit -m "revng Analyze: auto-commit results (run ${{ github.run_id }})"
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi

name: Ghidra Analyze

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Ghidra
        run: |
          curl -L -o ghidra.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
          unzip -q ghidra.zip

      - name: Download target binary from this repo's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ghidra-binary --repo ${{ github.repository }} --pattern "libminecraftpe.so"

      - name: Run headless analysis
        run: |
          mkdir -p proj
          ./ghidra_12.1.3_PUBLIC/support/analyzeHeadless "$GITHUB_WORKSPACE/proj" RedstoneTweaksProj \
            -import libminecraftpe.so \
            -scriptPath "$GITHUB_WORKSPACE/ghidra_scripts" \
            -preScript DisableHeavyAnalyzers.java \
            -postScript FindStateRefs.java \
            -deleteProject \
            -max-cpu 2 \
            -analysisTimeoutPerFile 1500 \
            2>&1 | tee analyze.log || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-results
          path: |
            state_refs_output.txt
            analyze.log
          if-no-files-found: warn

      - name: Commit results directly to the repo
        run: |
          mkdir -p Ghidra-Analysis-Data
          cp state_refs_output.txt Ghidra-Analysis-Data/state_refs_output.txt 2>/dev/null || true
          # analyze.log can be huge; keep only the tail so the commit stays small.
          tail -c 2000000 analyze.log > Ghidra-Analysis-Data/analyze_tail.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Ghidra-Analysis-Data/state_refs_output.txt Ghidra-Analysis-Data/analyze_tail.log
          if ! git diff --cached --quiet; then
            git commit -m "Ghidra Analyze: auto-commit results (run ${{ github.run_id }})"
            git push origin HEAD:main
          else
            echo "No changes to commit (no output files produced)."
          fi

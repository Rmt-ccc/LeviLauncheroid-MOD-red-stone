name: Ghidra Analyze

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Ghidra
        run: |
          curl -L -o ghidra.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
          unzip -q ghidra.zip

      - name: Download target binary from this repo's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ghidra-binary --repo ${{ github.repository }} --pattern "libminecraftpe.so"

      - name: Run headless analysis
        run: |
          mkdir -p proj
          ./ghidra_12.1.3_PUBLIC/support/analyzeHeadless "$GITHUB_WORKSPACE/proj" RedstoneTweaksProj \
            -import libminecraftpe.so \
            -scriptPath "$GITHUB_WORKSPACE/ghidra_scripts" \
            -preScript DisableHeavyAnalyzers.java \
            -postScript FindStateRefs.java \
            -postScript FindCallers.java \
            -postScript FindAccessorStrings.java \
            -postScript FindClassVtablesViaRTTI.java \
            -deleteProject \
            -max-cpu 2 \
            -analysisTimeoutPerFile 1500 \
            2>&1 | tee analyze.log || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-results
          path: |
            state_refs_output.txt
            caller_refs_output.txt
            accessor_refs_output.txt
            rtti_vtable_refs_output.txt
            analyze.log
          if-no-files-found: warn

      - name: Commit results directly to the repo
        run: |
          mkdir -p Ghidra-Analysis-Data

          # Appends each run's output as Ghidra-Analysis-Data/<basename>-N.txt,
          # N in roman numerals (Ⅰ, Ⅱ, Ⅲ, ...), one series per basename -
          # matching this repo's existing file-naming convention. Skips
          # creating a new numbered file when this run's output is
          # byte-identical to the latest existing one, so an unchanged
          # script doesn't pile up duplicate files run after run.
          # analyze.log (raw Ghidra stdout) is intentionally not archived -
          # the three scripts' own structured output files are what matter.
          archive_numbered() {
            local src="$1"
            local base="$2"
            [ -f "$src" ] || return 0

            local -a ROMAN=(Ⅰ Ⅱ Ⅲ Ⅳ Ⅴ Ⅵ Ⅶ Ⅷ Ⅸ Ⅹ Ⅺ Ⅻ)
            local count=0
            local latest_file=""
            local i
            for i in "${!ROMAN[@]}"; do
              local candidate="Ghidra-Analysis-Data/${base}-${ROMAN[$i]}.txt"
              if [ -f "$candidate" ]; then
                count=$((i + 1))
                latest_file="$candidate"
              fi
            done

            if [ -n "$latest_file" ] && cmp -s "$src" "$latest_file"; then
              echo "Skipping $base: identical to $latest_file"
              return 0
            fi

            if [ "$count" -ge "${#ROMAN[@]}" ]; then
              echo "WARNING: ran out of roman numerals for $base (reached ${ROMAN[-1]}); using plain index $((count + 1)) instead"
              cp "$src" "Ghidra-Analysis-Data/${base}-$((count + 1)).txt"
              git add "Ghidra-Analysis-Data/${base}-$((count + 1)).txt"
              return 0
            fi

            local next="${ROMAN[$count]}"
            cp "$src" "Ghidra-Analysis-Data/${base}-${next}.txt"
            git add "Ghidra-Analysis-Data/${base}-${next}.txt"
          }

          archive_numbered state_refs_output.txt state_refs_output
          archive_numbered caller_refs_output.txt caller_refs_output
          archive_numbered accessor_refs_output.txt accessor_refs_output
          archive_numbered rtti_vtable_refs_output.txt rtti_vtable_refs_output

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Ghidra Analyze: auto-commit results (run ${{ github.run_id }})"
            git push origin HEAD:main
          else
            echo "No changes to commit (no new output produced)."
          fi

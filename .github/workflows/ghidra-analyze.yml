name: Ghidra Analyze

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Ghidra
        run: |
          curl -L -o ghidra.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
          unzip -q ghidra.zip

      - name: Download target binary from this repo's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download ghidra-binary --repo ${{ github.repository }} --pattern "libminecraftpe.so"

      - name: Run headless analysis
        run: |
          mkdir -p proj
          ./ghidra_12.1.3_PUBLIC/support/analyzeHeadless "$GITHUB_WORKSPACE/proj" RedstoneTweaksProj \
            -import libminecraftpe.so \
            -scriptPath "$GITHUB_WORKSPACE/ghidra_scripts" \
            -preScript DisableHeavyAnalyzers.java \
            -postScript FindStateRefs.java \
            -postScript FindCallers.java \
            -postScript FindChunkIndexHeuristic.java \
            -deleteProject \
            -max-cpu 2 \
            -analysisTimeoutPerFile 1500 \
            2>&1 | tee analyze.log || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-results
          path: |
            state_refs_output.txt
            caller_refs_output.txt
            chunk_index_heuristic_output.txt
            analyze.log
          if-no-files-found: warn

      - name: Commit results directly to the repo
        run: |
          mkdir -p Ghidra-Analysis-Data Ghidra-Analysis-Data/Failure-File

          # Appends each run's output as <dir>/<basename>-N.txt, N in roman
          # numerals (Ⅰ, Ⅱ, Ⅲ, ...), one series per basename - matching this
          # repo's existing file-naming convention. Skips creating a new
          # numbered file when this run's output is byte-identical to the
          # latest existing one, so an unchanged script doesn't pile up
          # duplicate files run after run.
          # analyze.log (raw Ghidra stdout) is intentionally not archived in
          # full - the scripts' own structured output files are what matter;
          # a short error-only extract is captured separately below instead.
          archive_numbered() {
            local src="$1"
            local base="$2"
            local dir="$3"
            [ -f "$src" ] || return 0

            local -a ROMAN=(Ⅰ Ⅱ Ⅲ Ⅳ Ⅴ Ⅵ Ⅶ Ⅷ Ⅸ Ⅹ Ⅺ Ⅻ)
            local count=0
            local latest_file=""
            local i
            for i in "${!ROMAN[@]}"; do
              local candidate="${dir}/${base}-${ROMAN[$i]}.txt"
              if [ -f "$candidate" ]; then
                count=$((i + 1))
                latest_file="$candidate"
              fi
            done

            if [ -n "$latest_file" ] && cmp -s "$src" "$latest_file"; then
              echo "Skipping $base: identical to $latest_file"
              return 0
            fi

            if [ "$count" -ge "${#ROMAN[@]}" ]; then
              echo "WARNING: ran out of roman numerals for $base (reached ${ROMAN[-1]}); using plain index $((count + 1)) instead"
              cp "$src" "${dir}/${base}-$((count + 1)).txt"
              git add "${dir}/${base}-$((count + 1)).txt"
              return 0
            fi

            local next="${ROMAN[$count]}"
            cp "$src" "${dir}/${base}-${next}.txt"
            git add "${dir}/${base}-${next}.txt"
          }

          # Dead ends, newest first: vtable_slot4_candidates_output
          # (brute-force vtable scan for the slot-4 getBlock-equivalent
          # accessor - stage 1 alone matched 393,367 vtable-shaped word
          # sequences, and the stage-2 instruction-shape filter still
          # left 92,747 candidate functions; decompiling an arbitrary
          # capped subset of those found nothing tied to the one known
          # call site in FUN_09053250. Too large a search space without
          # a way to correlate candidates back to that call site - see
          # FindCallers.java's pivot below instead), signature_scan_output (BedrockTools'
          # AOB signatures - 0 matches for BlockSourceGetBlock, and the
          # few matches on the other two signatures decompiled to
          # unrelated code = false positives; root cause: AOB signatures
          # are tied to one specific Minecraft build, and this repo's
          # libminecraftpe.so is a Trial-xapk build whose embedded
          # format_version gates run up to 1.21.120, almost certainly
          # newer than whatever build BedrockTools' current signatures
          # were derived from), blockid_refs_output/funcptr_refs_output/
          # relocation_scan_output/class-RTTI scripts (string/name-based
          # search can't reach runtime tick/simulation code at all, since
          # the engine resolves every name to a numeric ID once at load
          # time). None of these run anymore - old output stays in
          # Failure-File/ for history, nothing new lands there.
          # Current active line: state_refs_output (aux-value formulas,
          # confirmed-useful), chunk_index_heuristic_output (found
          # FUN_09053250 / BlockTypeRegistry::getDirectAccessBlocks,
          # confirmed the vtable+0x20 getBlock-equivalent call pattern).
          # caller_refs_output's target list was repointed at
          # FUN_09053250 itself (its original two targets - the shared
          # BlockState-value intern helper and the redstone_signal
          # schema-registration constructor - were both confirmed
          # unrelated to live state reads and are retired, old results
          # kept in the archive below for history): finding real callers
          # of FUN_09053250 (if any exist via direct "bl", rather than
          # itself only being reached indirectly) may show the concrete
          # object type passed in as param_1/param_3, which is what the
          # failed vtable brute-force above couldn't get to.
          archive_numbered state_refs_output.txt state_refs_output Ghidra-Analysis-Data
          archive_numbered caller_refs_output.txt caller_refs_output Ghidra-Analysis-Data
          archive_numbered chunk_index_heuristic_output.txt chunk_index_heuristic_output Ghidra-Analysis-Data
          archive_numbered vtable_slot4_candidates_output.txt vtable_slot4_candidates_output Ghidra-Analysis-Data/Failure-File
          archive_numbered signature_scan_output.txt signature_scan_output Ghidra-Analysis-Data/Failure-File
          archive_numbered blockid_refs_output.txt blockid_refs_output Ghidra-Analysis-Data/Failure-File
          archive_numbered funcptr_refs_output.txt funcptr_refs_output Ghidra-Analysis-Data/Failure-File
          archive_numbered relocation_scan_output.txt relocation_scan_output Ghidra-Analysis-Data/Failure-File

          # Short, always-overwritten diagnostic: just the error/exception/
          # script-compile lines from this run's raw Ghidra log, so a run
          # that silently produces no output (e.g. a script compile error -
          # ghidra_scripts/ compiles as one bundle, so one broken file can
          # silently take every script down with it) is still debuggable
          # without archiving the full multi-MB raw log.
          grep -iE "error|exception|could not compile|compil(e|ation).*(fail|error)" analyze.log \
            > Ghidra-Analysis-Data/last_run_errors.txt 2>/dev/null || true
          if [ -s Ghidra-Analysis-Data/last_run_errors.txt ]; then
            git add Ghidra-Analysis-Data/last_run_errors.txt
          else
            rm -f Ghidra-Analysis-Data/last_run_errors.txt
            git rm --cached --ignore-unmatch -q Ghidra-Analysis-Data/last_run_errors.txt 2>/dev/null || true
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Ghidra Analyze: auto-commit results (run ${{ github.run_id }})"
            git push origin HEAD:main
          else
            echo "No changes to commit (no new output produced)."
          fi

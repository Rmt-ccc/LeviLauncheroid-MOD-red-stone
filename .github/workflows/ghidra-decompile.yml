name: Ghidra Decompile Search

# リポジトリの Actions タブ → このワークフロー → "Run workflow" から手動実行する。
# release_tag: .so が添付されている GitHub Release のタグ名 (例: v1.0.0)
# asset_name: Release に添付されている .so ファイルのアセット名 (例: libminecraftpe.so)
# search_terms: カンマ区切りの検索文字列(部分一致)。例: output_subtract_bit,comparator,subtract

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag of the GitHub Release that contains the .so asset"
        required: true
        default: "latest"
      asset_name:
        description: "Asset file name of the .so attached to the release"
        required: true
        default: "libminecraftpe.so"
      search_terms:
        description: "Comma-separated strings to search for (substring match)"
        required: true
        default: "output_subtract_bit,comparator,subtract"
      timeout_seconds:
        description: "Decompile timeout per function (seconds)"
        required: false
        default: "60"

jobs:
  decompile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Ghidra
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: ghidra
          key: ghidra-11.1.2-PUBLIC

      - name: Download Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          curl -L -o ghidra.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.1.2_build/ghidra_11.1.2_PUBLIC_20240709.zip
          unzip -q ghidra.zip
          mv ghidra_11.1.2_PUBLIC ghidra

      - name: Download .so from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin
          if [ "${{ inputs.release_tag }}" = "latest" ]; then
            gh release download --repo "${{ github.repository }}" \
              --pattern "${{ inputs.asset_name }}" \
              --output "bin/${{ inputs.asset_name }}"
          else
            gh release download "${{ inputs.release_tag }}" --repo "${{ github.repository }}" \
              --pattern "${{ inputs.asset_name }}" \
              --output "bin/${{ inputs.asset_name }}"
          fi

      - name: Verify downloaded .so exists
        run: |
          if [ ! -f "${{ github.workspace }}/bin/${{ inputs.asset_name }}" ]; then
            echo "::error::bin/${{ inputs.asset_name }} が見つかりません。release_tag / asset_name を見直してください。"
            exit 1
          fi
          ls -la "${{ github.workspace }}/bin/"

      - name: Run Ghidra headless analysis
        run: |
          mkdir -p ghidra_project output
          ghidra/support/analyzeHeadless \
            ghidra_project ComparatorSearchProject \
            -import "${{ github.workspace }}/bin/${{ inputs.asset_name }}" \
            -postScript find_and_decompile.py "${{ inputs.search_terms }}" "${{ github.workspace }}/output/result.txt" "${{ inputs.timeout_seconds }}" \
            -scriptPath "${{ github.workspace }}/scripts" \
            -deleteProject

      - name: Upload decompile result
        uses: actions/upload-artifact@v4
        with:
          name: decompile-result
          path: output/result.txt

name: Get Minecraft Trial

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
            - name: Checkout
        uses: actions/checkout@v4

            - name: Install apkeep 0.17.0 (fast, no check)
        run: |
          cargo install apkeep --version 0.17.0 --locked
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

            - name: Download Minecraft Trial
        run: |
          mkdir -p apk
          apkeep -a com.mojang.minecrafttrialpe -d apkpure apk/ || \
          apkeep -a com.mojang.minecrafttrialpe -d googleplay apk/
          ls -lh apk/

            - name: Upload APK/XAPK
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-trial
          path: apk/*
          retention-days: 7

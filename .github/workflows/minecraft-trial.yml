name: Get Minecraft Trial

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install apkeep with cargo
        run: cargo install apkeep

      - name: Download Minecraft Trial
        run: |
          mkdir -p apk
          echo "Trying apk-pure first..."
          ~/.cargo/bin/apkeep -a com.mojang.minecrafttrialpe -d apk-pure apk/ || \
          ~/.cargo/bin/apkeep -a com.mojang.minecrafttrialpe apk/
          ls -lh apk/

      - name: Upload APK/XAPK
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-trial
          path: apk/*
          retention-days: 7

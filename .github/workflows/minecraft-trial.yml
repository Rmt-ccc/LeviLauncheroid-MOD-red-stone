name: Get Minecraft Trial

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download via APKPure API (bypass Cloudflare)
        run: |
          mkdir -p apk
          pkg="com.mojang.minecrafttrialpe"
          echo "Fetching $pkg from api.pureapk.com..."
          
          # apkeepと同じAPIエンドポイントを使う
          curl -sS "https://api.pureapk.com/m/v3/cms/app_version?hl=en-US&package_name=$pkg" \
            -H "x-sv: 29" \
            -H "x-abis: arm64-v8a,armeabi-v7a,armeabi" \
            -H "x-gp: 1" -o api.json

          cat api.json | head -c 1000
          echo ""

          python3 - << 'PY'
          import json, re, requests, sys
          with open("api.json","rb") as f:
              data=f.read().decode(errors="ignore")
          # apkeepの実装と同じく /APK を含むURLを探す
          m = re.findall(r'https://[^"\s]+\.apk[^"\s]*', data)
          # pureapkのAPIはエスケープされてる事があるのでstrings的に探す
          if not m:
              m = re.findall(r'https://.*?/APK/[^"\s]+', data)
          # jsonとしてパースできる場合も試す
          try:
              j=json.loads(data)
              txt=json.dumps(j)
              m2=re.findall(r'https://[^\s"]+\.apk', txt)
              m.extend(m2)
          except: pass

          print(f"Found candidates: {m[:5]}")
          if not m:
              print("No apk url found in api.json")
              sys.exit(1)
          # 最初のAPKを使う（latest）
          url = m[0].replace("\\u002F","/")
          print(f"Downloading {url}")
          headers={"User-Agent":"Mozilla/5.0"}
          with requests.get(url, headers=headers, stream=True, timeout=300) as r:
              r.raise_for_status()
              with open("apk/Minecraft-Trial.apk","wb") as out:
                  for chunk in r.iter_content(8192):
                      out.write(chunk)
          print("Saved")
          PY
          ls -lh apk/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-trial
          path: apk/*
          retention-days: 7

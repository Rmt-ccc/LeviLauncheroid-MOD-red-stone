name: Build RedstoneTweaksMod

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest
    steps:
      - name: Checkout RedstoneTweaksMod
        uses: actions/checkout@v4

      - name: Checkout preloader-android
        uses: actions/checkout@v4
        with:
          repository: LiteLDev/preloader-android
          path: third_party/preloader-android
          submodules: recursive

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          add-to-path: false

      - name: Build (arm64-v8a)
        shell: pwsh
        run: |
          ./build.ps1 -Ndk "${{ steps.setup-ndk.outputs.ndk-path }}" -Clean

      - name: Verify package contents
        shell: pwsh
        run: |
          tar -tf ./dist/arm64-v8a/RedstoneTweaksMod.levipack

      - name: Upload .levipack artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedstoneTweaksMod-arm64-v8a
          path: ./dist/arm64-v8a/RedstoneTweaksMod.levipack
          if-no-files-found: error

  release:
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: RedstoneTweaksMod-arm64-v8a
          path: ./release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release/RedstoneTweaksMod.levipack
          generate_release_notes: true
